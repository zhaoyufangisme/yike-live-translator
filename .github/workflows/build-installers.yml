name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Build local web client
        run: |
          npm ci
          npm run build:client
      - name: Build Argos offline component
        working-directory: desktop
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --noconfirm --clean --onefile --name argos-service --distpath argos-dist argos_service.py
      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Yike-Windows-v0.2.0
          path: desktop/release/Yike-Setup-0.2.0.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build local web client
        run: |
          npm ci
          npm run build:client
      - name: Create Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Yike-Android-0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yike-Android-v0.2.0
          path: mobile/Yike-Android-0.2.0.apk
          if-no-files-found: error

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "译刻 ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            --latest
